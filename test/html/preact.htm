<!DOCTYPE html>
<html>

<head>
	<title>Preact Test</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style>
		div:not(#app) {
			padding: 10px;
			margin: 10px;
		}
	</style>
	<script src="clickout-event.js"></script>
</head>

<body>
	<div id="app"></div>
	<script type="module">
		import { h, render } from "https://esm.sh/preact@11";
		import htm from "https://esm.sh/htm@3";

		const html = htm.bind(h);

		function set(event) {
			let el = event.target;
			el.innerText = event.type;
			setTimeout(() => el.innerHTML = "&nbsp;", 500);
		}

		// Preact registers "on*" props with addEventListener,
		// so out-events can be used directly in the template.
		render(html`
			<div style="background:blue;" onclickout=${set}> </div>
			<div style="background:red;" onmousedownout=${set}> </div>
			<div style="background:yellow;" onmouseupout=${set}> </div>
			<div style="background:green;" onpointerupout=${set}> </div>
		`, document.getElementById("app"));
	</script>
</body>

</html>
